AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: Trak - Step Tracking App Backend

Parameters:
  UserPoolId:
    Type: String
    Description: Existing Cognito User Pool ID
  UserPoolClientId:
    Type: String
    Description: Existing Cognito User Pool Client ID
  FirebaseProjectId:
    Type: String
  FirebaseClientEmail:
    Type: String

Globals:
  Function:
    Timeout: 10
    Runtime: nodejs22.x
    Architectures:
      - x86_64
    Environment:
      Variables:
        USERS_TABLE: !Ref UsersTable
        STEPS_TABLE: !Ref StepsTable
        FRIENDS_TABLE: !Ref FriendsTable
        INVENTORY_TABLE: !Ref InventoryTable
        SNAPSHOTS_TABLE: !Ref SnapshotsTable
        FRIEND_REQUESTS_TABLE: !Ref FriendRequestsTable
        AVATARS_BUCKET: !Ref AvatarsBucket
        FIREBASE_PROJECT_ID: !Ref FirebaseProjectId
        FIREBASE_CLIENT_EMAIL: !Ref FirebaseClientEmail
        FIREBASE_PRIVATE_KEY_PARAM: /trak/firebase/private_key

Resources:

  # ── API ──────────────────────────────────────────────────────────────────────

  TrakApi:
    Type: AWS::Serverless::HttpApi
    Properties:
      StageName: prod
      Auth:
        DefaultAuthorizer: CognitoAuthorizer
        Authorizers:
          CognitoAuthorizer:
            IdentitySource: $request.header.Authorization
            JwtConfiguration:
              issuer: !Sub "https://cognito-idp.${AWS::Region}.amazonaws.com/${UserPoolId}"
              audience:
                - !Ref UserPoolClientId

  # ── DynamoDB Tables ───────────────────────────────────────────────────────────

  UsersTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub "${AWS::StackName}-users"
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: userId
          AttributeType: S
        - AttributeName: username
          AttributeType: S
      KeySchema:
        - AttributeName: userId
          KeyType: HASH
      GlobalSecondaryIndexes:
        - IndexName: username-index
          KeySchema:
            - AttributeName: username
              KeyType: HASH
          Projection:
            ProjectionType: ALL

  StepsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub "${AWS::StackName}-steps"
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: userId
          AttributeType: S
        - AttributeName: date
          AttributeType: S
      KeySchema:
        - AttributeName: userId
          KeyType: HASH
        - AttributeName: date
          KeyType: RANGE

  FriendsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub "${AWS::StackName}-friends"
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: userId
          AttributeType: S
        - AttributeName: friendId
          AttributeType: S
      KeySchema:
        - AttributeName: userId
          KeyType: HASH
        - AttributeName: friendId
          KeyType: RANGE

  FriendRequestsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub "${AWS::StackName}-friend-requests"
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: toUserId
          AttributeType: S
        - AttributeName: fromUserId
          AttributeType: S
      KeySchema:
        - AttributeName: toUserId
          KeyType: HASH
        - AttributeName: fromUserId
          KeyType: RANGE

  SnapshotsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub "${AWS::StackName}-snapshots"
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: userId
          AttributeType: S
        - AttributeName: date
          AttributeType: S
      KeySchema:
        - AttributeName: userId
          KeyType: HASH
        - AttributeName: date
          KeyType: RANGE

  InventoryTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub "${AWS::StackName}-inventory"
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: userId
          AttributeType: S
        - AttributeName: itemId
          AttributeType: S
      KeySchema:
        - AttributeName: userId
          KeyType: HASH
        - AttributeName: itemId
          KeyType: RANGE

  # ── S3 Buckets ────────────────────────────────────────────────────────────────

  AvatarsBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub "${AWS::StackName}-avatars"
      PublicAccessBlockConfiguration:
        BlockPublicAcls: false
        BlockPublicPolicy: false
        IgnorePublicAcls: false
        RestrictPublicBuckets: false
      CorsConfiguration:
        CorsRules:
          - AllowedHeaders:
              - "*"
            AllowedMethods:
              - PUT
            AllowedOrigins:
              - "*"
            MaxAge: 3000

  AvatarsBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref AvatarsBucket
      PolicyDocument:
        Statement:
          - Effect: Allow
            Principal: "*"
            Action: s3:GetObject
            Resource: !Sub "arn:aws:s3:::${AvatarsBucket}/*"

  # ── Lambda Functions ──────────────────────────────────────────────────────────

  UsersFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: src/users/
      Handler: app.handler
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref UsersTable
        - S3WritePolicy:
            BucketName: !Ref AvatarsBucket
      Events:
        UpsertUser:
          Type: HttpApi
          Properties:
            ApiId: !Ref TrakApi
            Path: /users
            Method: POST
        GetAvatarUploadUrl:
          Type: HttpApi
          Properties:
            ApiId: !Ref TrakApi
            Path: /users/avatar
            Method: POST
        GetMe:
          Type: HttpApi
          Properties:
            ApiId: !Ref TrakApi
            Path: /users/me
            Method: GET
        GetUser:
          Type: HttpApi
          Properties:
            ApiId: !Ref TrakApi
            Path: /users/{userId}
            Method: GET

  StepsFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: src/steps/
      Handler: app.handler
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref StepsTable
        - DynamoDBCrudPolicy:
            TableName: !Ref InventoryTable
      Events:
        SubmitSteps:
          Type: HttpApi
          Properties:
            ApiId: !Ref TrakApi
            Path: /steps
            Method: POST
        GetSteps:
          Type: HttpApi
          Properties:
            ApiId: !Ref TrakApi
            Path: /steps
            Method: GET

  LeaderboardFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: src/leaderboard/
      Handler: app.handler
      Policies:
        - DynamoDBReadPolicy:
            TableName: !Ref UsersTable
        - DynamoDBReadPolicy:
            TableName: !Ref FriendsTable
        - DynamoDBReadPolicy:
            TableName: !Ref StepsTable
        - DynamoDBReadPolicy:
            TableName: !Ref SnapshotsTable
      Events:
        GetLeaderboard:
          Type: HttpApi
          Properties:
            ApiId: !Ref TrakApi
            Path: /leaderboard
            Method: GET

  FriendsFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: src/friends/
      Handler: app.handler
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref FriendsTable
        - DynamoDBReadPolicy:
            TableName: !Ref UsersTable
        - DynamoDBCrudPolicy:
            TableName: !Ref FriendRequestsTable
        - SSMParameterReadPolicy:
            ParameterName: trak/firebase/private_key
      Events:
        SendFriendRequest:
          Type: HttpApi
          Properties:
            ApiId: !Ref TrakApi
            Path: /friends
            Method: POST
        RemoveFriend:
          Type: HttpApi
          Properties:
            ApiId: !Ref TrakApi
            Path: /friends/{friendId}
            Method: DELETE
        ListFriends:
          Type: HttpApi
          Properties:
            ApiId: !Ref TrakApi
            Path: /friends
            Method: GET
        ListFriendRequests:
          Type: HttpApi
          Properties:
            ApiId: !Ref TrakApi
            Path: /friends/requests
            Method: GET
        AcceptFriendRequest:
          Type: HttpApi
          Properties:
            ApiId: !Ref TrakApi
            Path: /friends/requests/{fromUserId}/accept
            Method: POST
        DeclineFriendRequest:
          Type: HttpApi
          Properties:
            ApiId: !Ref TrakApi
            Path: /friends/requests/{fromUserId}
            Method: DELETE

  InventoryFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: src/inventory/
      Handler: app.handler
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref InventoryTable
        - DynamoDBCrudPolicy:
            TableName: !Ref StepsTable
        - DynamoDBReadPolicy:
            TableName: !Ref FriendsTable
        - DynamoDBReadPolicy:
            TableName: !Ref UsersTable
        - SSMParameterReadPolicy:
            ParameterName: trak/firebase/private_key
      Events:
        GetInventory:
          Type: HttpApi
          Properties:
            ApiId: !Ref TrakApi
            Path: /inventory
            Method: GET
        UseItem:
          Type: HttpApi
          Properties:
            ApiId: !Ref TrakApi
            Path: /inventory/use
            Method: POST
        GrantItem:
          Type: HttpApi
          Properties:
            ApiId: !Ref TrakApi
            Path: /inventory
            Method: POST

  SnapshotFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: src/snapshot/
      Handler: app.handler
      Timeout: 60
      Policies:
        - DynamoDBReadPolicy:
            TableName: !Ref FriendsTable
        - DynamoDBReadPolicy:
            TableName: !Ref StepsTable
        - DynamoDBReadPolicy:
            TableName: !Ref UsersTable
        - DynamoDBCrudPolicy:
            TableName: !Ref SnapshotsTable
      Events:
        DailySnapshot:
          Type: Schedule
          Properties:
            Schedule: cron(5 0 * * ? *)
            Description: Snapshot daily leaderboards at 00:05 UTC

Outputs:
  ApiUrl:
    Description: API Gateway base URL
    Value: !Sub "https://${TrakApi}.execute-api.${AWS::Region}.amazonaws.com/prod"
  UsersTableName:
    Value: !Ref UsersTable
  StepsTableName:
    Value: !Ref StepsTable
  FriendsTableName:
    Value: !Ref FriendsTable
  InventoryTableName:
    Value: !Ref InventoryTable
  AvatarsBucketName:
    Value: !Ref AvatarsBucket

